<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora Modelo 210 · Impuesto de no residentes en España</title>
<link rel="canonical" href="https://asiergonzalez.com/modelo-210/">
<meta name="description" content="Calcula en 30 segundos lo que debes por tu piso en España. Modelo 210, IRNR. Normativa verificada contra el BOE.">
<style>
  :root{
    --bg:#fbfaf8; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e3e0da;
    --accent:#0f5132; --accent-soft:#e7f0ea; --warn:#8a5a00; --warn-soft:#fdf4e3;
    --card:#fff; --radius:10px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#141413; --fg:#ecebe8; --muted:#a3a09a; --line:#2e2d2a;
           --accent:#7cc39b; --accent-soft:#1c2b23; --warn:#e0b062; --warn-soft:#2b2318; --card:#1c1b1a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:32px 20px 72px}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:28px}
  .brand{font-weight:600;letter-spacing:-.01em}
  .langs button{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 6px;font-size:14px}
  .langs button[aria-pressed="true"]{color:var(--fg);font-weight:600;text-decoration:underline}
  h1{font-size:1.7rem;line-height:1.25;letter-spacing:-.02em;margin:0 0 10px}
  .lede{color:var(--muted);margin:0 0 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  label{display:block;font-size:14px;font-weight:500;margin:0 0 6px}
  .hint{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:4px}
  .field{margin-bottom:18px}
  input,select{width:100%;padding:11px 12px;font:inherit;color:var(--fg);
    background:var(--bg);border:1px solid var(--line);border-radius:8px}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  .out{margin-top:24px;background:var(--accent-soft);border:1px solid var(--line);
       border-radius:var(--radius);padding:20px}
  .out .big{font-size:2.1rem;font-weight:650;letter-spacing:-.02em;color:var(--accent)}
  .out dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:14px 0 0;font-size:14px}
  .out dt{color:var(--muted)} .out dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .deadline{margin-top:16px;background:var(--warn-soft);border-left:3px solid var(--warn);
            padding:12px 14px;border-radius:6px;font-size:14px}
  .deadline strong{color:var(--warn)}
  .cta{display:block;margin-top:24px;text-align:center;background:var(--accent);color:#fff;
       text-decoration:none;padding:14px;border-radius:8px;font-weight:600}
  @media (prefers-color-scheme:dark){ .cta{color:#0d1f16} }
  .note{font-size:12.5px;color:var(--muted);margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
  .note a{color:inherit}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">Asier González</div>
  <nav class="langs" aria-label="Idioma">
    <button data-lang="es" aria-pressed="true">ES</button>
    <button data-lang="en" aria-pressed="false">EN</button>
    <button data-lang="nl" aria-pressed="false">NL</button>
  </nav>
</header>

<h1 data-t="h1"></h1>
<p class="lede" data-t="lede"></p>

<div class="card">
  <div class="field">
    <label for="vc" data-t="l_vc"></label>
    <input id="vc" type="number" min="0" step="any" inputmode="decimal" placeholder="120000">
    <div class="hint" data-t="h_vc"></div>
  </div>

  <div class="row">
    <div class="field">
      <label for="rev" data-t="l_rev"></label>
      <select id="rev">
        <option value="0.011" data-t="o_rev1"></option>
        <option value="0.02" data-t="o_rev2"></option>
      </select>
    </div>
    <div class="field">
      <label for="res" data-t="l_res"></label>
      <select id="res">
        <option value="0.19" data-t="o_res1"></option>
        <option value="0.24" data-t="o_res2"></option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label for="part" data-t="l_part"></label>
      <input id="part" type="number" min="0" max="100" step="any" value="100">
    </div>
    <div class="field">
      <label for="dias" data-t="l_dias"></label>
      <input id="dias" type="number" min="0" max="365" step="1" value="365">
      <div class="hint" data-t="h_dias"></div>
    </div>
  </div>

  <div class="out" aria-live="polite">
    <div class="big" id="cuota">—</div>
    <div class="hint" data-t="out_sub"></div>
    <dl>
      <dt data-t="k_base"></dt><dd id="base">—</dd>
      <dt data-t="k_coef"></dt><dd id="coef">—</dd>
      <dt data-t="k_tipo"></dt><dd id="tipo">—</dd>
    </dl>
    <div class="deadline">
      <strong data-t="dl_title"></strong>
      <div data-t="dl_body"></div>
    </div>
  </div>

  <a class="cta" id="cta" href="#" data-t="cta"></a>
</div>

<p class="note" data-t="note"></p>

</div>
<script>
// ---- Configuracion. Rellenar antes de publicar. ----
const WHATSAPP_E164 = "34613351397"; // p.ej. 34600000000

// ---- Normativa. Verificada 8-jul-2026 contra Orden HAC/623/2026 (BOE-A-2026-13573)
// y art. 24.5 / 25 TRLIRNR (RDLeg 5/2004). Ver NORMATIVA-VERIFICADA.md.
// Esta calculadora cubre SOLO renta imputada de inmueble urbano de uso propio (tipo de renta 02),
// devengo 31-dic-2025, que es lo que se declara durante todo 2026.

const I18N = {
  es:{
    h1:"¿Cuánto debes a Hacienda por tu piso en España?",
    lede:"Si eres no residente y tienes una vivienda en España, presentar el Modelo 210 es obligatorio todos los años, aunque no la alquiles y aunque no ganes un euro con ella. Calcúlalo en 30 segundos.",
    l_vc:"Valor catastral de la vivienda (€)",
    h_vc:"Aparece en tu recibo del IBI. No es lo que pagaste por el piso.",
    l_rev:"Revisión del valor catastral",
    o_rev1:"Revisado desde 2012 (1,1%)",
    o_rev2:"No revisado (2%)",
    l_res:"Tu residencia fiscal",
    o_res1:"Unión Europea / EEE (19%)",
    o_res2:"Resto del mundo (24%)",
    l_part:"Tu porcentaje de propiedad (%)",
    l_dias:"Días a tu disposición",
    h_dias:"365 si fue tuya y vacía todo el año.",
    out_sub:"a pagar por el ejercicio 2025",
    k_base:"Base imponible", k_coef:"Coeficiente", k_tipo:"Tipo de gravamen",
    dl_title:"Plazo: hasta el 31 de diciembre de 2026.",
    dl_body:"La norma cambió en junio de 2026. A partir del devengo de 2026, el plazo pasa a ser del 1 de abril al 31 de diciembre del año siguiente, y el alquiler deja de declararse por trimestres.",
    cta:"Que me lo presenten. Escríbeme por WhatsApp",
    note:"Cálculo orientativo para renta imputada de vivienda urbana de uso propio (tipo de renta 02). No cubre alquiler, transmisión ni otras rentas. Base = valor catastral × coeficiente × (días/365) × % de propiedad. Fuentes: art. 24.5 y 25 del RDLeg 5/2004 y Orden HAC/623/2026 (BOE de 23 de junio de 2026). No constituye asesoramiento fiscal."
  },
  en:{
    h1:"How much do you owe Spain for your property?",
    lede:"If you are a non-resident who owns a home in Spain, filing Form 210 is compulsory every single year, even if you never rent it out and never earn a cent from it. Work it out in 30 seconds.",
    l_vc:"Cadastral value of the property (€)",
    h_vc:"It is printed on your IBI council tax bill. It is not what you paid for the property.",
    l_rev:"Cadastral value revision",
    o_rev1:"Revised since 2012 (1.1%)",
    o_rev2:"Not revised (2%)",
    l_res:"Your tax residence",
    o_res1:"European Union / EEA (19%)",
    o_res2:"Rest of the world (24%)",
    l_part:"Your ownership share (%)",
    l_dias:"Days at your disposal",
    h_dias:"365 if you owned it and left it empty all year.",
    out_sub:"payable for tax year 2025",
    k_base:"Taxable base", k_coef:"Coefficient", k_tipo:"Tax rate",
    dl_title:"Deadline: 31 December 2026.",
    dl_body:"The rules changed in June 2026. From the 2026 accrual onwards the window becomes 1 April to 31 December of the following year, and rental income is no longer filed quarterly.",
    cta:"File it for me. Message me on WhatsApp",
    note:"Indicative calculation for imputed income on an urban property for personal use (income type 02). Does not cover rental income, disposals or other income. Base = cadastral value × coefficient × (days/365) × ownership share. Sources: arts. 24.5 and 25 of RDLeg 5/2004 and Order HAC/623/2026 (Spanish Official Gazette, 23 June 2026). This is not tax advice."
  },
  nl:{
    h1:"Hoeveel bent u de Spaanse fiscus schuldig voor uw woning?",
    lede:"Bent u niet-ingezetene met een woning in Spanje, dan is het Modelo 210 elk jaar verplicht, ook als u de woning niet verhuurt en er geen cent aan verdient. Bereken het in 30 seconden.",
    l_vc:"Kadastrale waarde van de woning (€)",
    h_vc:"Staat op uw IBI-aanslag. Het is niet de prijs die u voor de woning betaalde.",
    l_rev:"Herziening kadastrale waarde",
    o_rev1:"Herzien sinds 2012 (1,1%)",
    o_rev2:"Niet herzien (2%)",
    l_res:"Uw fiscale woonplaats",
    o_res1:"Europese Unie / EER (19%)",
    o_res2:"Rest van de wereld (24%)",
    l_part:"Uw eigendomsaandeel (%)",
    l_dias:"Dagen tot uw beschikking",
    h_dias:"365 als de woning het hele jaar van u was en leegstond.",
    out_sub:"te betalen over belastingjaar 2025",
    k_base:"Belastbare grondslag", k_coef:"Coëfficiënt", k_tipo:"Tarief",
    dl_title:"Termijn: tot 31 december 2026.",
    dl_body:"De regels zijn in juni 2026 gewijzigd. Vanaf het belastingjaar 2026 loopt de termijn van 1 april tot 31 december van het volgende jaar, en verhuurinkomsten worden niet langer per kwartaal aangegeven.",
    cta:"Regel het voor mij. Stuur mij een WhatsApp",
    note:"Indicatieve berekening voor toegerekend inkomen uit een stedelijke woning voor eigen gebruik (inkomenstype 02). Niet voor verhuur, verkoop of overige inkomsten. Grondslag = kadastrale waarde × coëfficiënt × (dagen/365) × eigendomsaandeel. Bronnen: art. 24.5 en 25 RDLeg 5/2004 en Orden HAC/623/2026 (Spaans Staatsblad, 23 juni 2026). Dit is geen fiscaal advies."
  }
};

let lang = (navigator.language||"es").slice(0,2);
if(!I18N[lang]) lang = "es";

const $ = id => document.getElementById(id);
const fields = ["vc","rev","res","part","dias"];

function money(n){
  return new Intl.NumberFormat(lang==="en"?"en-IE":lang==="nl"?"nl-NL":"es-ES",
    {style:"currency",currency:"EUR",maximumFractionDigits:2}).format(n);
}

function paint(){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{
    const v = t[el.dataset.t];
    if(v!==undefined) el.textContent = v;
  });
  document.querySelectorAll(".langs button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  calc();
}

function calc(){
  const vc = parseFloat($("vc").value);
  const coef = parseFloat($("rev").value);
  const tipo = parseFloat($("res").value);
  const part = Math.min(Math.max(parseFloat($("part").value)||0,0),100)/100;
  const dias = Math.min(Math.max(parseInt($("dias").value,10)||0,0),365);

  $("coef").textContent = (coef*100).toLocaleString(lang==="en"?"en-IE":"es-ES",{minimumFractionDigits:1})+" %";
  $("tipo").textContent = (tipo*100)+" %";

  if(!isFinite(vc) || vc<=0){
    $("cuota").textContent = "—"; $("base").textContent = "—";
    return;
  }
  const base = vc * coef * (dias/365) * part;
  $("base").textContent = money(base);
  $("cuota").textContent = money(base * tipo);
}

function ctaHref(){
  const t = I18N[lang];
  const msg = encodeURIComponent(t.cta);
  $("cta").href = WHATSAPP_E164.startsWith("WHATSAPP_")
    ? "#" : `https://wa.me/${WHATSAPP_E164}?text=${msg}`;
}

document.querySelectorAll(".langs button").forEach(b=>
  b.addEventListener("click",()=>{ lang=b.dataset.lang; paint(); ctaHref(); }));
fields.forEach(f=>$(f).addEventListener("input",calc));

paint(); ctaHref();
</script>
</body>
</html>
